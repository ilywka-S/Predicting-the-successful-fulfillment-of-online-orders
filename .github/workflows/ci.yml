name: CI Pipeline

on:
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  backend:
    name: Backend & ML Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__TestPostgres: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore Backend
      run: dotnet restore OrderSense.Backend.slnf
      
    - name: Build Backend
      run: dotnet build OrderSense.Backend.slnf --no-restore
      
    - name: Run Tests
      run: dotnet test OrderSense.Backend.slnf --no-build --verbosity normal --collect:"XPlat Code Coverage"

  maui-android:
    name: MAUI Android Build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      id: setup-dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Cache .NET Workloads
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files\dotnet\packs
          C:\Program Files\dotnet\sdk-manifests
          C:\Program Files\dotnet\library-packs
          C:\Program Files\dotnet\metadata
          C:\Program Files\dotnet\template-packs
        key: ${{ runner.os }}-dotnet-workloads-${{ steps.setup-dotnet.outputs.dotnet-version }}
          
    - name: Restore Workloads
      run: dotnet workload restore OrderSense.sln
      
    - name: Build Android
      run: dotnet build src/OrderSense.Maui/OrderSense.Maui.csproj -c Release -f net10.0-android

  maui-windows:
    name: MAUI Windows Build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      id: setup-dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Cache .NET Workloads
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files\dotnet\packs
          C:\Program Files\dotnet\sdk-manifests
          C:\Program Files\dotnet\library-packs
          C:\Program Files\dotnet\metadata
          C:\Program Files\dotnet\template-packs
        key: ${{ runner.os }}-dotnet-workloads-${{ steps.setup-dotnet.outputs.dotnet-version }}
          
    - name: Restore Workloads
      run: dotnet workload restore OrderSense.sln
      
    - name: Build Windows
      run: dotnet build src/OrderSense.Maui/OrderSense.Maui.csproj -c Release -f net10.0-windows10.0.19041.0
