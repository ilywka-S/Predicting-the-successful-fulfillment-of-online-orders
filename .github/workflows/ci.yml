name: CI Pipeline

on:
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  check-changes:
    name: Check File Changes
    runs-on: ubuntu-latest
    outputs:
      maui: ${{ steps.filter.outputs.maui }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
    
      id: filter
      with:
        filters: |
          maui:
            - 'src/OrderSense.Maui/**'
            - 'src/OrderSense.Client.Core/**'

  backend:
    name: Backend & Client Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__TestPostgres: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore Solution
      run: dotnet restore OrderSense.sln -p:EnableWindowsTargeting=true

    - name: Build Solution
      run: dotnet build OrderSense.sln --no-restore -p:EnableWindowsTargeting=true

    - name: Run Tests with Coverage
      run: >
        dotnet test OrderSense.sln 
        --no-build 
        --verbosity normal 
        -p:EnableWindowsTargeting=true
        --collect:"XPlat Code Coverage" 
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs,**/*.g.cs,**/OrderSense.Api.json,**/Client.cs"

    - name: Generate Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "**/coverage.cobertura.xml"
        badge: true
        fail_below_min: false #
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both

    - name: Add Coverage Comment to PR
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

  maui-android:
    name: MAUI Android Build
    needs: check-changes
    if: needs.check-changes.outputs.maui == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Install .NET MAUI Workload Android
      run: dotnet workload install maui-android
      
    - name: Restore MAUI Android
      run: dotnet restore src/OrderSense.Maui/OrderSense.Maui.csproj
      
    - name: Build Android
      run: dotnet build src/OrderSense.Maui/OrderSense.Maui.csproj -c Release -f net10.0-android --no-restore

  maui-windows:
    name: MAUI Windows Build
    needs: check-changes
    if: needs.check-changes.outputs.maui == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Install .NET MAUI Workload Windows
      run: dotnet workload install maui-windows
      
    - name: Build Windows
      run: dotnet build src/OrderSense.Maui/OrderSense.Maui.csproj -c Release -f net10.0-windows10.0.19041.0
