name: Release Artifacts

on:
  push:
    branches: [ "staging", "main" ]
  workflow_dispatch:

jobs:
  build-release-packages:
    name: Build Release APK & MSIX
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Install .NET MAUI Workloads
      run: dotnet workload install maui

    - name: Decode Android Keystore
      shell: pwsh
      run: |
        $bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
        [IO.File]::WriteAllBytes("src/OrderSense.Maui/ordersense.keystore", $bytes)

    - name: Build Android APK
      run: >
        dotnet publish src/OrderSense.Maui/OrderSense.Maui.csproj 
        -c Release 
        -f net10.0-android 
        -p:AndroidKeyStore=true 
        -p:AndroidSigningKeyStore=ordersense.keystore 
        -p:AndroidSigningKeyAlias=ordersense 
        -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} 
        -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    - name: Build Windows MSIX
      run: >
        dotnet publish src/OrderSense.Maui/OrderSense.Maui.csproj 
        -c Release 
        -f net10.0-windows10.0.19041.0 
        -p:GenerateAppxPackageOnBuild=true 
        -p:AppxPackageSigningEnabled=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrderSense-Android-APK
        path: src/OrderSense.Maui/bin/Release/net10.0-android/*.apk

    - name: Upload MSIX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrderSense-Windows-MSIX
        path: src/OrderSense.Maui/bin/Release/net10.0-windows10.0.19041.0/win10-x64/AppPackages/**/*.msix